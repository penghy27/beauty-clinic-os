name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Same native libraries the deployment image installs (packages.txt).
      - run: sudo apt-get update && sudo apt-get install -y $(cat packages.txt)
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
